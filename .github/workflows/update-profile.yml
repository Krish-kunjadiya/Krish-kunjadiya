name: Update profile

on:
  schedule:
    - cron: "23 0 * * *" # every day at 00:23 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - profile.json
      - data/portrait.json
      - fonts/**
      - scripts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public GitHub data
        run: python scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Render cards and README
        run: python scripts/render_cards.py

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/github.json cards
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
